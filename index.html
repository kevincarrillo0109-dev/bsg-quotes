// Single source of truth for every scope section. Array order = render order, used by
// both the auto-attached scope and the "Custom scope of work" picker. To offer a new

// (auto scope attaches a section when a line item has the same category as `key`).
// custom:true = free-form section filled in from q.custom_scope_other.
// final:true = always rendered last and unnumbered.
const SCOPE_SECTIONS=[
  {key:"plaster",title:"Pool Interior Resurfacing",autoNum:1,items:["Drain the pool and remove all hydrostatic plugs as needed.","Project includes standard industry surface preparation methods prior to plaster installation, including treatment of areas as needed to provide a suitable bonding surface.","Acid wash and clean interior surface thoroughly.","Apply bonding agent (primer coat) to entire pool shell.","Install new plaster finish per selected material — hand-troweled for a smooth, uniform finish.","Perform standard startup procedure: brush daily, monitor chemical levels, and ensure proper curing."]},
  {key:"tile",title:"Waterline Tile Removal & Installation",autoNum:2,items:["Remove existing waterline tile and prepare surface.","Clean and level the waterline bond beam.","Install new 6\"x6\" frost-resistant porcelain tile selected by client.","Apply tile adhesive and waterproof grout for long-term durability.","Clean all tile joints and polish finish."]},
  {key:"coping",title:"Coping Demolition & Installation",autoNum:3,items:["Remove existing coping around the full pool perimeter.","Prep edge and set new coping using selected stone — 2\" thick.","Use mortar base and spacers to ensure level installation.","Custom hand-cut corners and curves as needed.","Finish with appropriate joint grout and cleanup.","Natural stone may vary slightly in color and texture."]},
  {key:"other",title:"Other",custom:true,items:[]},
  {key:"final",title:"Final Cleaning, Fill-Up & Inspection",final:true,defaultChecked:true,items:["Clean surrounding work areas, rinse deck and coping.","Begin controlled pool refill upon curing of plaster.","Perform final quality inspection and walkthrough with client to confirm completion and satisfaction."]},
];

// Auto scope (unchanged behavior): pool sections matching the quote's categories, keeping
// their fixed 1/2/3 numbers, followed by Final Cleaning whenever any pool section attached.
function autoScopeSections(cats){
  const out=SCOPE_SECTIONS.filter(s=>s.autoNum&&cats.has(s.key)).map(s=>({title:`${s.autoNum}. ${s.title}`,items:s.items}));
  if(out.length>0)SCOPE_SECTIONS.filter(s=>s.final).forEach(s=>out.push({title:s.title,items:s.items}));
  return out;
}
// Old quotes predate these fields — fill safe defaults so they load unchecked and never hold null arrays.
function withCustomScopeDefaults(q){
  const other=q.custom_scope_other||{};
  return{
    ...q,
    custom_scope_enabled:!!q.custom_scope_enabled,
    custom_scope_sections:Array.isArray(q.custom_scope_sections)?q.custom_scope_sections:[],
    custom_scope_other:{title:typeof other.title==="string"?other.title:"",bullets:Array.isArray(other.bullets)?other.bullets:[]},
  };
}
// Custom scope: checked sections in SCOPE_SECTIONS order, numbered 1, 2, 3… by what's checked;
// final sections render last and unnumbered.
function customScopeSections(quote){
  const q=withCustomScopeDefaults(quote);
  const picked=new Set(q.custom_scope_sections);
  const numbered=[],finals=[];
  SCOPE_SECTIONS.forEach(s=>{
    if(!picked.has(s.key))return;
    if(s.final){finals.push({title:s.title,items:s.items});return;}
    let title=s.title,items=s.items;
    if(s.custom){
      items=q.custom_scope_other.bullets.map(b=>String(b).trim()).filter(Boolean);
      title=q.custom_scope_other.title.trim()||s.title;
      if(!q.custom_scope_other.title.trim()&&items.length===0)return;
    }
    numbered.push({title:`${numbered.length+1}. ${title}`,items});
  });
  return[...numbered,...finals];
}

function ClientView({qid}){
  const[q,setQ]=React.useState(null);
  const[loading,setLoading]=React.useState(true);
  // Refetch whenever the quote ID changes, ignoring a slower response for a previous ID.
  React.useEffect(()=>{
    let stale=false;
    setQ(null);setLoading(true);
    dbGetOne(qid).then(data=>{if(stale)return;setQ(data);setLoading(false);});
    return()=>{stale=true;};
  },[qid]);
  if(loading)return<div style={{display:"flex",justifyContent:"center",alignItems:"center",height:"100vh",background:IVORY,color:CHARCOAL,fontFamily:BODY,fontWeight:600,fontSize:16}}>Loading your quote...</div>;
  if(!q)return<div style={{display:"flex",justifyContent:"center",alignItems:"center",height:"100vh",background:IVORY,color:CHARCOAL,fontFamily:BODY,fontWeight:600}}>Quote not found.</div>;
  return<PrintView key={qid} q={q}/>;
}

function Editor({quote,rates,onSave,onCancel,onDelete,saveStatus,smartAddDefaultOpen}){
  const[q,setQ]=React.useState(()=>withCustomScopeDefaults(quote));
  const[showSmartAdd,setShowSmartAdd]=React.useState(!!smartAddDefaultOpen);
  const set=(k,v)=>setQ(p=>({...p,[k]:v}));
  const addSmartItem=item=>setQ(p=>({...p,items:[...p.items,item]}));

  const handleProduct=(id,productKey)=>{
    const prod=PRODUCTS[productKey]||PRODUCTS["Add-On Service"];
    const priceFields=prod.defaultPrice!=null?{unit:prod.defaultPrice,total:prod.defaultPrice}:{};
    setQ(p=>({
      ...p,
      notes:prod.notes!=null?prod.notes:p.notes,
      items:p.items.map(i=>i.id===id?{...i,productKey,itemName:prod.itemName,desc:prod.desc,...priceFields}:i)
    }));
  };
  const setItem=(id,k,v)=>setQ(p=>({...p,items:p.items.map(i=>i.id===id?{...i,[k]:v}:i)}));
  const addItem=()=>setQ(p=>({...p,items:[...p.items,eItem()]}));
  const removeItem=id=>setQ(p=>({...p,items:p.items.filter(i=>i.id!==id)}));
  const toggleCustomScope=on=>setQ(p=>{
    const pc=getCats(p.items);
    const quoteHasPool=pc.has("plaster")||pc.has("tile")||pc.has("coping");
    return{
      ...p,
      custom_scope_enabled:on,
      // First time on (nothing picked yet): start with the default-checked sections, but only
      // for quotes with pool work — trampoline-only quotes start with nothing ticked.
      custom_scope_sections:on&&p.custom_scope_sections.length===0&&quoteHasPool?SCOPE_SECTIONS.filter(s=>s.defaultChecked).map(s=>s.key):p.custom_scope_sections,
    };
  });
  const toggleScopeSection=(key,on)=>setQ(p=>({...p,custom_scope_sections:on?[...p.custom_scope_sections.filter(k=>k!==key),key]:p.custom_scope_sections.filter(k=>k!==key)}));
  const setScopeOther=(k,v)=>setQ(p=>({...p,custom_scope_other:{...p.custom_scope_other,[k]:v}}));

  const cats=getCats(q.items);
  const hasPool=cats.has("plaster")||cats.has("tile")||cats.has("coping");
  const hasTrampoline=cats.has("trampoline");
  const hasScopeService=hasPool||hasTrampoline;
  // With custom scope on, the old free-text "Customize" only applies to the trampoline section.
  const showLegacyCustomize=hasScopeService&&(!q.custom_scope_enabled||hasTrampoline);
  const s=sub(q),d=dsc(q),t=tx(q),total_=tot(q);

  return(
    <div style={{minHeight:"100vh",background:CHARCOAL,color:IVORY,fontFamily:BODY,padding:"24px 16px"}}>
      <div style={{maxWidth:700,margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
          <div>
            <div style={display(18)}>{q.quoteNumber}</div>
            <div style={{...eyebrow(),marginTop:4}}>Backyard Solutions Group</div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {saveStatus&&<span style={{fontSize:12,fontWeight:600,color:MUTED_DARK}}>{saveStatus}</span>}
            <button onClick={onCancel} style={btn2}>Cancel</button>
            <button onClick={()=>onSave(q)} style={btn()}>Save</button>
          </div>
        </div>
        {/* Client Info */}
        <div style={card}>
          <div style={secTitle}>Client Info</div>
          <div style={{display:"flex",gap:12,marginBottom:10}}>
            <div style={{flex:1}}><label style={lbl}>Client Name</label><input value={q.client} onChange={e=>set("client",e.target.value)} placeholder="John Smith" style={inp}/></div>
            <div style={{flex:1}}><label style={lbl}>Date</label><input type="date" value={q.date} onChange={e=>set("date",e.target.value)} style={inp}/></div>
          </div>
          <div style={{display:"flex",gap:12}}>
            <div style={{flex:1}}><label style={lbl}>Address</label><input value={q.address} onChange={e=>set("address",e.target.value)} placeholder="123 Main St, Cedar Hill TX" style={inp}/></div>
            <div style={{flex:1}}><label style={lbl}>Deposit Required ($)</label><input type="number" value={q.deposit||""} onChange={e=>set("deposit",e.target.value)} placeholder="e.g. 2000" style={inp} min={0}/></div>
          </div>
        </div>
        {/* Line Items */}
        <div style={card}>
          <div style={secTitle}>Line Items</div>

            const cat=PRODUCTS[item.productKey]?PRODUCTS[item.productKey].category:"other";
            const isTrampoline=cat==="trampoline";

// ─── Payout Breakdown (internal only, never rendered in PrintView/ClientView) ──
function PayoutBreakdown({items}){
  const rows=payoutRows(items);
  if(rows.length===0)return null;
  const bySubcontractor={};
  let bsgProfit=0;
  rows.forEach(i=>{
    const name=i.subcontractorName||"Unknown";
    bySubcontractor[name]=(bySubcontractor[name]||0)+(Number(i.subcontractorCost)||0);
    bsgProfit+=Number(i.profitAmount)||0;
  });
  return(
    <div style={card}>
      <div style={secTitle}>Payout Breakdown (Internal Only)</div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:15}}>
          <thead>
            <tr style={{textAlign:"left",...eyebrow()}}>
              <th style={{padding:"4px 8px"}}>Line Item</th><th style={{padding:"4px 8px"}}>Subcontractor</th><th style={{padding:"4px 8px"}}>Sub Cost</th><th style={{padding:"4px 8px"}}>Profit</th><th style={{padding:"4px 8px"}}>Client Price</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(i=>(
              <tr key={i.id} style={{borderTop:divider}}>
                <td style={{padding:"6px 8px"}}>{i.itemName||"—"}</td>
                <td style={{padding:"6px 8px"}}>{i.subcontractorName}</td>
                <td style={{padding:"6px 8px"}}>{fmt(i.subcontractorCost)}</td>
                <td style={{padding:"6px 8px"}}>{fmt(i.profitAmount)}</td>
                <td style={{padding:"6px 8px"}}>{fmt(i.total)}</td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            {Object.entries(bySubcontractor).map(([name,total])=>(
              <tr key={name} style={{borderTop:divider}}>
                <td colSpan={2} style={{padding:"6px 8px",fontWeight:800}}>Total owed to {name}</td>
                <td style={{padding:"6px 8px",fontWeight:800}}>{fmt(total)}</td><td></td><td></td>
              </tr>
            ))}
            <tr style={{borderTop:divider}}>
              <td colSpan={3} style={{padding:"6px 8px",fontWeight:800,color:LIME}}>Total BSG Profit</td>
              <td style={{padding:"6px 8px",...display(18,LIME)}}>{fmt(bsgProfit)}</td><td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  );
}

const NEW_SERVICE_OPT="__new_service__";
function rateTypeLabel(unit){return unit==="sq ft"?"Per Sq.Ft.":unit==="linear ft"?"Per Ln.Ft.":"Per Each";}
function RateAdminPanel({rates,onAdd,onUpdate,onDelete}){
  const emptyForm={service:"",newService:"",subcontractor:"",unit:"linear ft",price:"",isPinned:false,suggestedProfitType:"percent",suggestedProfitValue:""};
  const[form,setForm]=React.useState(emptyForm);
  const[editingId,setEditingId]=React.useState(null);

  const distinctServices=React.useMemo(()=>[...new Set(rates.map(r=>r.service))].sort(),[rates]);
  const serviceForCategory=svc=>{const existing=rates.find(r=>r.service===svc);return existing?existing.category:"other";};

  const startEdit=r=>{setEditingId(r.id);setForm({service:r.service,newService:"",subcontractor:r.subcontractor,unit:r.unit,price:r.price,isPinned:!!r.isPinned,suggestedProfitType:r.suggestedProfitType||"percent",suggestedProfitValue:r.suggestedProfitValue!=null?r.suggestedProfitValue:""});};
  const cancelEdit=()=>{setEditingId(null);setForm(emptyForm);};
  const submit=()=>{
    const effectiveService=form.service===NEW_SERVICE_OPT?form.newService.trim():form.service;
    if(!effectiveService||!form.subcontractor||!form.price)return;
    const rt={id:editingId||genRateId(),category:serviceForCategory(effectiveService),service:effectiveService,subcontractor:form.subcontractor,unit:form.unit,price:Number(form.price),isPinned:form.isPinned,suggestedProfitType:form.suggestedProfitType,suggestedProfitValue:Number(form.suggestedProfitValue)||0};
    if(rt.isPinned){
      rates.filter(r=>r.service===effectiveService&&r.id!==rt.id&&r.isPinned).forEach(r=>onUpdate({...r,isPinned:false}));
    }
    if(editingId)onUpdate(rt);else onAdd(rt);
    cancelEdit();
  };

  const sorted=[...rates].sort((a,b)=>a.service.localeCompare(b.service)||a.subcontractor.localeCompare(b.subcontractor));

  return(
    <div style={card}>
      <div style={secTitle}>Subcontractor Rate Table</div>
      <div style={{overflowX:"auto",marginBottom:14}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead>
            <tr style={{textAlign:"left",...eyebrow()}}>
              <th style={{padding:"4px 8px"}}>Service</th><th style={{padding:"4px 8px"}}>Contractor</th><th style={{padding:"4px 8px"}}>Rate Type</th><th style={{padding:"4px 8px"}}>Rate ($)</th><th style={{padding:"4px 8px"}}></th>
            </tr>
          </thead>
          <tbody>
            {sorted.map(r=>(
              <tr key={r.id} style={{borderTop:divider}}>
                <td style={{padding:"6px 8px"}}>{r.service}</td>
                <td style={{padding:"6px 8px"}}>{r.isPinned&&<span title="Pinned default contractor" style={{color:LIME,marginRight:4}}>★</span>}{r.subcontractor}</td>
                <td style={{padding:"6px 8px"}}>{rateTypeLabel(r.unit)}</td>
                <td style={{padding:"6px 8px"}}>{fmt(r.price)}</td>
                <td style={{padding:"6px 8px",whiteSpace:"nowrap"}}>
                  <button onClick={()=>startEdit(r)} style={{...btn2,...btnSm,marginRight:6}}>Edit</button>
                  <button onClick={()=>{if(window.confirm("Delete this rate?"))onDelete(r.id);}} style={{...btnDanger,...btnSm}}>Delete</button>
                </td>
              </tr>
            ))}
            {sorted.length===0&&<tr><td colSpan={5} style={{padding:"12px 8px",color:MUTED_DARK}}>No rates yet.</td></tr>}
          </tbody>
        </table>
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
        <div style={{flex:1,minWidth:160}}>
          <label style={lbl}>Service</label>
          <select value={form.service} onChange={e=>setForm(f=>({...f,service:e.target.value,newService:""}))} style={inp}>
            <option value="">— Select —</option>
            {distinctServices.map(s=><option key={s} value={s}>{s}</option>)}
            <option value={NEW_SERVICE_OPT}>+ Add New Service</option>
          </select>
          {form.service===NEW_SERVICE_OPT&&<input value={form.newService} onChange={e=>setForm(f=>({...f,newService:e.target.value}))} style={{...inp,marginTop:6}} placeholder="New service name"/>}
        </div>
        <div style={{minWidth:120}}><label style={lbl}>Contractor Name</label><input value={form.subcontractor} onChange={e=>setForm(f=>({...f,subcontractor:e.target.value}))} style={inp} placeholder="e.g. Alfonso"/></div>
        <div style={{minWidth:120}}>
          <label style={lbl}>Rate Type</label>
          <select value={form.unit} onChange={e=>setForm(f=>({...f,unit:e.target.value}))} style={inp}>
            <option value="linear ft">Per Ln.Ft.</option>
            <option value="each">Per Each</option>
          </select>
        </div>
        <div style={{minWidth:100}}><label style={lbl}>Rate Amount ($)</label><input type="number" value={form.price} onChange={e=>setForm(f=>({...f,price:e.target.value}))} style={inp} min={0} step="0.01"/></div>
        <div style={{minWidth:170,paddingBottom:7}}>
          <label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,fontWeight:600,color:MUTED_DARK,cursor:"pointer"}}>

        </div>
        <div style={{minWidth:120}}>
          <label style={lbl}>Suggested Profit Type</label>
          <select value={form.suggestedProfitType} onChange={e=>setForm(f=>({...f,suggestedProfitType:e.target.value}))} style={inp}>

}

// ─── Smart Add (inside Editor) ────────────────────────────
function SmartAddPanel({rates,onAdd}){
  const[service,setService]=React.useState("");
  const[rateId,setRateId]=React.useState("");
  const[qty,setQty]=React.useState("");
  const[profitType,setProfitType]=React.useState("percent");
  const[profitValue,setProfitValue]=React.useState("");

  const serviceOptions=React.useMemo(()=>[...new Set(rates.map(r=>r.service))].sort(),[rates]);
  const serviceGroups=React.useMemo(()=>{
    const remaining=new Set(serviceOptions);
    const groups=SMART_ADD_SERVICE_GROUPS.map(g=>{
      const options=g.services.filter(s=>remaining.has(s));
      options.forEach(s=>remaining.delete(s));
      return{label:g.label,options};
    }).filter(g=>g.options.length>0);
    const other=[...remaining].sort();
    if(other.length)groups.push({label:"── Other / Add-On ──",options:other});
    return groups;
  },[serviceOptions]);
  const matchingRates=rates.filter(r=>r.service===service);
  const category=matchingRates[0]?matchingRates[0].category:"other";
  const selectedRate=rates.find(r=>r.id===rateId);
  const isEach=selectedRate&&selectedRate.unit==="each";
  const qtyLabel=selectedRate?(isEach?"Quantity":`Perimeter (${rateTypeLabel(selectedRate.unit).replace("Per ","")})`):"Perimeter (Ln.Ft.)";

  const quantity=Number(qty)||0;
  const subCost=selectedRate?quantity*Number(selectedRate.price):0;
  const profitAmount=profitType==="percent"?subCost*(Number(profitValue)||0)/100:(Number(profitValue)||0);
  const clientTotal=subCost+profitAmount;

  const applySuggestedProfit=r=>{
    setProfitType(r&&r.suggestedProfitType?r.suggestedProfitType:"percent");
    setProfitValue(r&&r.suggestedProfitValue!=null&&r.suggestedProfitValue!==0?String(r.suggestedProfitValue):"");
  };

  const selectService=svc=>{
    setService(svc);
    setQty("");
    const rowsForSvc=rates.filter(r=>r.service===svc);
    const svcDefault=SERVICE_DEFAULT_CONTRACTOR[svc];
    const forced=svcDefault&&rowsForSvc.find(r=>r.subcontractor===svcDefault.subcontractor);
    const pinned=rowsForSvc.find(r=>r.isPinned);
    const alfonso=rowsForSvc.find(r=>r.subcontractor==="Alfonso");
    const chosen=forced||pinned||alfonso||(rowsForSvc.length===1?rowsForSvc[0]:null);
    setRateId(chosen?chosen.id:"");
    applySuggestedProfit(chosen);
  };
  const selectRate=id=>{
    setRateId(id);
    applySuggestedProfit(rates.find(r=>r.id===id));
  };

  const canAdd=!!(selectedRate&&quantity>0);

  const handleAdd=()=>{
    if(!canAdd)return;
    const svcDefault=SERVICE_DEFAULT_CONTRACTOR[service];
    const label=svcDefault&&selectedRate.subcontractor===svcDefault.subcontractor?svcDefault.itemName
      :category==="other"?service:`${RATE_CATEGORY_LABEL[category]} - ${service}`;
    const productKey=rateProductKey(category,service);
    const desc=(PRODUCTS[productKey]&&PRODUCTS[productKey].desc)||"";
    onAdd({
      id:Date.now()+Math.random(),
      productKey,
      itemName:label,
      desc,
      qty:quantity,
      unit:Math.round(clientTotal*100)/100,
      total:Math.round(clientTotal*100)/100,
      qtyUnitLabel:isEach?"":rateTypeLabel(selectedRate.unit).replace("Per ",""),
      isFlat:false,
      subcontractorName:selectedRate.subcontractor,
      subcontractorCost:Math.round(subCost*100)/100,
      profitAmount:Math.round(profitAmount*100)/100,
      profitType,
    });
    setService("");setRateId("");setQty("");setProfitType("percent");setProfitValue("");
  };

  return(
    <div style={{background:CHARCOAL,borderRadius:12,padding:12,marginBottom:10,border:`1px solid ${LIME}`}}>
      <div style={{marginBottom:8}}>
        <label style={lbl}>Service</label>
        <select value={service} onChange={e=>selectService(e.target.value)} style={inp}>
          <option value="">— Select —</option>
          {serviceGroups.map(g=>(
            <optgroup key={g.label} label={g.label}>
              {g.options.map(s=><option key={s} value={s}>{s}</option>)}
            </optgroup>
          ))}
        </select>
      </div>
      {service&&(
        <div style={{marginBottom:8}}>
          <label style={lbl}>Contractor{matchingRates.some(r=>r.isPinned)?" (default pinned — switch to override)":""}</label>
          <select value={rateId} onChange={e=>selectRate(e.target.value)} style={inp}>
            <option value="">— Select —</option>
            {matchingRates.map(r=><option key={r.id} value={r.id}>{r.isPinned?"★ ":""}{r.subcontractor} — {fmt(r.price)}/{rateTypeLabel(r.unit)}</option>)}
          </select>
        </div>
      )}
      {selectedRate&&(
        <div style={{marginBottom:8}}>
          <label style={lbl}>{qtyLabel}</label>
          <input type="number" value={qty} onChange={e=>setQty(e.target.value)} style={{...inp,width:90,border:`2px solid ${LIME}`}} min={0}/>
        </div>
      )}
      {selectedRate&&(
        <div style={{background:GRAPHITE,border:divider,borderRadius:12,padding:"12px 14px",marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:6}}><span>Contractor Cost</span><span>{fmt(subCost)}</span></div>
          <div style={{marginBottom:6}}>
            <label style={lbl}>Suggested Profit (editable)</label>
            <div style={{display:"flex",gap:6}}>
              <select value={profitType} onChange={e=>setProfitType(e.target.value)} style={{...inp,width:110}}>
                <option value="percent">% Markup</option>
                <option value="flat">Flat $ Add</option>
              </select>
              <input type="number" value={profitValue} onChange={e=>setProfitValue(e.target.value)} style={inp} placeholder={profitType==="percent"?"e.g. 20":"e.g. 500"} min={0} step="0.01"/>
            </div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:6,color:MUTED_DARK}}><span>Profit Amount</span><span style={{color:IVORY,fontWeight:800}}>{fmt(profitAmount)}</span></div>
          <div style={{borderTop:divider,marginTop:4,paddingTop:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={eyebrow(IVORY)}>Client Price</span><span style={display(22,LIME)}>{fmt(clientTotal)}</span></div>
        </div>
      )}
      <button disabled={!canAdd} onClick={handleAdd} style={{...(canAdd?btn():btn2),opacity:canAdd?1:0.5,cursor:canAdd?"pointer":"not-allowed"}}>Add Line Item</button>
    </div>
  );
}

// ─── Dashboard / App ─────────────────────────────────────
function App(){
  const[quotes,setQuotes]=React.useState([]);
  const[loading,setLoading]=React.useState(true);
  const[view,setView]=React.useState("dashboard");
  const[current,setCurrent]=React.useState(null);
  const[filter,setFilter]=React.useState("All");
  const[shareLink,setShareLink]=React.useState(null);
  const[saveStatus,setSaveStatus]=React.useState("");
  const[rates,setRates]=React.useState([]);
  const[smartAddDefault,setSmartAddDefault]=React.useState(false);

  // Check for client-facing view via ?q= param
  const urlParams=new URLSearchParams(window.location.search);
  const qParam=urlParams.get("q");
  if(qParam){return<ClientView key={qParam} qid={qParam}/>;}

  // Legacy hash support
  const hash=window.location.hash.replace("#","");
  if(hash.startsWith("quote/")){const hid=hash.replace("quote/","");return<ClientView key={hid} qid={hid}/>;}

  React.useEffect(()=>{dbGetAll().then(rows=>{setQuotes(rows.map(r=>JSON.parse(r.data)));setLoading(false);});},[]);
  React.useEffect(()=>{
    dbGetAllRates().then(async rows=>{
      if(rows===null)return;
      if(rows.length===0){
        await Promise.all(DEFAULT_RATES.map(dbUpsertRate));
        setRates(DEFAULT_RATES);
      }else{
        setRates(rows.map(r=>JSON.parse(r.data)));
      }
    });
  },[]);

  const saveQuote=async(q)=>{setSaveStatus("Saving...");const ok=await dbUpsert(q);if(ok){setQuotes(p=>p.find(x=>x.id===q.id)?p.map(x=>x.id===q.id?q:x):[q,...p]);setSaveStatus("Saved ✓");setTimeout(()=>setSaveStatus(""),2000);setView("dashboard");}else{setSaveStatus("Error — check connection");}};
  const duplicateQuote=async(q)=>{const duplicate=JSON.parse(JSON.stringify(q));duplicate.id=genId();duplicate.quoteNumber=genQN();duplicate.status="Draft";duplicate.items=duplicate.items.map(i=>({...i,id:Date.now()+Math.random()}));const ok=await dbUpsert(duplicate);if(ok){setQuotes(p=>[duplicate,...p]);setView("dashboard");}};
  const deleteQuote=async(id)=>{await dbDelete(id);setQuotes(p=>p.filter(x=>x.id!==id));setView("dashboard");};
  const updateStatus=async(id,status)=>{const u=quotes.map(x=>x.id===id?{...x,status}:x);setQuotes(u);await dbUpsert(u.find(x=>x.id===id));};
  const getLink=q=>`${APP_URL}/?q=${q.id}`;

  const addRate=async(rt)=>{const ok=await dbUpsertRate(rt);if(ok)setRates(p=>[...p,rt]);};
  const updateRate=async(rt)=>{const ok=await dbUpsertRate(rt);if(ok)setRates(p=>p.map(r=>r.id===rt.id?rt:r));};
  const deleteRate=async(id)=>{await dbDeleteRate(id);setRates(p=>p.filter(r=>r.id!==id));};
  const openNewQuote=()=>{setCurrent({...eQuote(),items:[]});setSmartAddDefault(false);setView("editor");};
  const openSmartQuote=()=>{setCurrent({...eQuote(),items:[]});setSmartAddDefault(true);setView("editor");};
  const openEditQuote=q=>{setCurrent(q);setSmartAddDefault(false);setView("editor");};

  const filtered=filter==="All"?quotes:quotes.filter(q=>q.status===filter);
  const totalOwed=quotes.filter(q=>!["Paid in Full","Draft"].includes(q.status)).reduce((s,q)=>s+tot(q),0);
  const totalCollected=quotes.filter(q=>q.status==="Paid in Full").reduce((s,q)=>s+tot(q),0);
  const totalDeposit=quotes.filter(q=>q.status==="Deposit Paid").reduce((s,q)=>s+tot(q),0);

  if(view==="editor")return<Editor quote={current} rates={rates} onSave={saveQuote} onCancel={()=>setView("dashboard")} onDelete={deleteQuote} saveStatus={saveStatus} smartAddDefaultOpen={smartAddDefault}/>;
  if(view==="preview")return<PrintView q={current} onBack={()=>setView("dashboard")}/>;
  if(view==="rates")return<RateAdminPage rates={rates} onAdd={addRate} onUpdate={updateRate} onDelete={deleteRate} onDone={()=>setView("dashboard")}/>;

  return(
    <div style={{minHeight:"100vh",background:CHARCOAL,color:IVORY,fontFamily:BODY,padding:"24px 16px"}}>
      <div style={{maxWidth:960,margin:"0 auto"}}>
        {/* Header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:16,marginBottom:28}}>
          <BrandMark size={28} eyebrowText="Backyard Solutions Group · Quote Management"/>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button onClick={()=>setView("rates")} style={btn2}>Manage Rates</button>
            <button onClick={openSmartQuote} style={btn2}>Pricing Calculator</button>
            <button onClick={openNewQuote} style={btn()}>+ New Quote</button>
          </div>
        </div>
        {/* Summary Cards */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:24}}>
          {[{label:"Outstanding",value:fmt(totalOwed),color:LIME},{label:"Deposit Paid",value:fmt(totalDeposit),color:IVORY},{label:"Collected",value:fmt(totalCollected),color:IVORY}].map(c=>(
            <div key={c.label} style={{background:GRAPHITE,border:divider,borderRadius:12,padding:"16px 18px",minWidth:0}}>
              <div style={{...eyebrow(),marginBottom:8}}>{c.label}</div>
              <div style={{...display(20,c.color),overflowWrap:"anywhere"}}>{c.value}</div>
            </div>
          ))}
        </div>
        {/* Filter Buttons */}
        <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
          {["All",...STATUSES].map(s=><button key={s} onClick={()=>setFilter(s)} style={{padding:"6px 14px",borderRadius:999,fontSize:12,cursor:"pointer",border:`1px solid ${filter===s?LIME:LINE}`,background:filter===s?LIME:"transparent",color:filter===s?CHARCOAL:MUTED_DARK,fontWeight:800}}>{s}</button>)}
        </div>
        {/* Share Modal */}
        {shareLink&&(
          <div style={{position:"fixed",inset:0,background:"rgba(15,16,19,0.85)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>setShareLink(null)}>
            <div style={{background:GRAPHITE,border:divider,borderRadius:12,padding:28,maxWidth:480,width:"90%",boxShadow:`6px 6px 0 ${INK}`}} onClick={e=>e.stopPropagation()}>
              <div style={{...display(18),marginBottom:8}}>Share Quote with Client</div>
              <div style={{fontSize:12,color:MUTED_DARK,marginBottom:12}}>Text or email this link. Client opens it on any device.</div>
              <div style={{background:CHARCOAL,border:divider,borderRadius:6,padding:"10px 14px",fontSize:12,color:LIME,wordBreak:"break-all",marginBottom:14}}>{shareLink}</div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={async()=>{await navigator.clipboard.writeText(shareLink);setShareLink(null);}} style={btn()}>Copy Link</button>
                <button onClick={()=>setShareLink(null)} style={btn2}>Close</button>
              </div>
            </div>
          </div>
        )}
        {/* Quote List */}
        {loading?(
          <div style={{textAlign:"center",color:MUTED_DARK,padding:"60px 0",fontSize:14}}>Loading quotes...</div>
        ):filtered.length===0?(
          <div style={{textAlign:"center",color:MUTED_DARK,padding:"60px 0",fontSize:14}}>No quotes yet. Hit + New Quote to start.</div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {filtered.map(q=>{
              const payout=payoutSummary(q);
              return(
              <div key={q.id} style={{background:GRAPHITE,border:divider,borderRadius:12,padding:"14px 16px"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                  <div style={{flex:1,minWidth:160}}>
                    <div style={{fontWeight:800,fontSize:14,color:IVORY}}>{q.client||"No Client"}</div>
                    <div style={{fontSize:11,color:MUTED_DARK,marginTop:2}}>{q.quoteNumber} · {q.date}</div>
                  </div>
                  <div style={{...display(18,LIME),minWidth:90,textAlign:"right"}}>{fmt(tot(q))}</div>
                  <select value={q.status} onChange={e=>updateStatus(q.id,e.target.value)} style={{...(STATUS_STYLE[q.status]||STATUS_STYLE.Draft),borderRadius:6,padding:"5px 8px",fontSize:12,cursor:"pointer",fontWeight:800,fontFamily:BODY}}>{STATUSES.map(s=><option key={s} value={s}>{s}</option>)}</select>
                  <button onClick={()=>window.open(getLink(q),"_blank")} style={{...btn2,...btnSm}}>Preview</button>
                  <button onClick={()=>setShareLink(getLink(q))} style={{...btn2,...btnSm}}>Share</button>
                  <button onClick={()=>duplicateQuote(q)} style={{...btn2,...btnSm}}>Duplicate</button>
                  <button onClick={()=>openEditQuote(q)} style={{...btn2,...btnSm}}>Edit</button>
                </div>
                {payout.has&&<div style={{fontSize:11,color:MUTED_DARK,marginTop:10,paddingTop:10,borderTop:divider}}>Contractor: {fmt(payout.contractor)} total · Profit: {fmt(payout.profit)} total</div>}
              </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// Opening a second quote link in the same tab can change only the hash (old #quote/ links)
// or restore the previous page from the back/forward cache — reload so the new quote loads.
window.addEventListener("hashchange",()=>location.reload());
window.addEventListener("pageshow",e=>{if(e.persisted)location.reload();});
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
